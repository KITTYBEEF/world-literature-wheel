<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>世界文学大转盘 · 管理员后台</title>

<style>
:root {
  --bg: #f7f5ef;
  --card: #ffffff;
  --text: #302f2b;
  --muted: #77756d;
  --border: #e5e0d5;
  --accent: #58745c;
  --danger: #a7473f;
  --soft: #eeece4;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI",
    "Microsoft YaHei", sans-serif;
  line-height: 1.6;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
}

header {
  margin-bottom: 28px;
}

h1 {
  font-size: clamp(24px, 4vw, 36px);
  margin: 0 0 8px;
}

h2 {
  font-size: 21px;
  margin-top: 0;
}

p {
  margin-top: 6px;
}

.muted {
  color: var(--muted);
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 4px 18px #00000005;
}

input, select, button {
  font: inherit;
}

input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 9px;
  margin: 8px 0 14px;
  background: white;
  color: var(--text);
}

button {
  border: 0;
  border-radius: 9px;
  padding: 10px 16px;
  cursor: pointer;
  background: var(--accent);
  color: white;
}

button:disabled {
  opacity: 0.55;
  cursor: wait;
}

button.secondary {
  background: var(--soft);
  color: var(--text);
}

button.danger {
  background: var(--danger);
}

button.small {
  padding: 7px 11px;
  font-size: 14px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
  align-items: center;
}

.toolbar button.active {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.status {
  padding: 12px 14px;
  border-radius: 9px;
  margin: 14px 0;
  background: var(--soft);
  overflow-wrap: anywhere;
}

.status.error {
  color: #8b2929;
  background: #fff0ee;
}

.status.success {
  color: #285b37;
  background: #edf7ed;
}

.hidden {
  display: none !important;
}

.submission {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 14px;
  background: white;
}

.submission h3 {
  margin: 0 0 12px;
  font-size: 19px;
  overflow-wrap: anywhere;
}

.details {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 20px;
  margin-bottom: 16px;
}

.detail {
  min-width: 0;
  overflow-wrap: anywhere;
}

.detail strong {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 3px;
}

.detail.full {
  grid-column: 1 / -1;
}

a {
  color: var(--accent);
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin: 30px 0;
}

@media (max-width: 600px) {
  body {
    padding: 14px;
  }

  .card {
    padding: 18px;
  }

  .details {
    grid-template-columns: 1fr;
  }

  .detail.full {
    grid-column: auto;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>📚 世界文学大转盘</h1>
  <p class="muted">管理员后台 · 投稿审核</p>
</header>

<section id="loginPanel" class="card">
  <h2>管理员登录</h2>
  <p class="muted">
    请输入已配置在 Cloudflare Worker 中的管理员密钥。
  </p>

  <form id="loginForm">
    <label for="secret">管理员密钥</label>
    <input
      id="secret"
      type="password"
      autocomplete="current-password"
      required
      minlength="32"
      placeholder="请输入管理员密钥"
    >
    <button id="loginButton" type="submit">登录</button>
  </form>

  <div id="loginMessage" class="status hidden"
       role="status" aria-live="polite"></div>
</section>

<section id="dashboard" class="hidden">

  <div class="card">
    <h2>🔍 书库查重</h2>
    <p class="muted">输入书名或作者名，在书库中查找是否已存在。</p>

    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <input
        id="adminSearchInput"
        type="text"
        placeholder="输入书名或作者名，回车即可搜索"
        style="flex:1;min-width:220px;margin:0;"
      >
      <button id="adminSearchButton">搜索</button>
    </div>

    <div id="adminSearchResult" style="margin-top:16px;"></div>
  </div>

  <div class="card">
    <h2>投稿管理</h2>
    <div class="toolbar">
      <button class="tab active" data-status="pending">
        ⏳ 待审核
      </button>

      <button class="tab secondary" data-status="approved">
        ✅ 已通过
      </button>

      <button class="tab secondary" data-status="rejected">
        ❌ 已拒绝
      </button>

      <button id="refreshButton" class="secondary">
        ↻ 刷新
      </button>

      <button id="logoutButton" class="secondary">
        退出登录
      </button>
    </div>

    <div id="listMessage" class="status hidden"
         role="status" aria-live="polite"></div>

    <div id="submissionList"></div>
  </div>

</section>

<footer>
  世界文学大转盘 · 管理员专用
</footer>

</div>

<script>
"use strict";

// 现有的 Cloudflare Worker 地址
const API_BASE =
  "https://book-suggest.kittybeef.workers.dev";

// 密钥只保存在当前页面的 JavaScript 内存中。
// 不使用 localStorage、sessionStorage 或 Cookie 保存密钥。
let adminSecret = "";
let currentStatus = "pending";
let requestVersion = 0;

const $ = (id) => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function showMessage(element, message, type = "") {
  element.textContent = message;
  element.className = "status" +
    (type ? " " + type : "");
}

function hideMessage(element) {
  element.textContent = "";
  element.className = "status hidden";
}

// ===== 书库加载与查重（审核用） =====
let BOOKS = [];
let booksLoaded = false;

function loadBooks(){
  return new Promise((resolve) => {
    if (booksLoaded){ resolve(); return; }

    const files = [
      "data/books/prehistory.js",
      "data/books/early-civ.js",
      "data/books/classical.js",
      "data/books/post-classical.js",
      "data/books/early-modern.js",
      "data/books/industry-empire.js",
      "data/books/global-conflict.js",
      "data/books/contemporary.js"
    ];

    let loaded = 0;
    function tryFinish(){
      loaded++;
      if (loaded < files.length) return;

      BOOKS = [
        ...(window.BOOKS_PREHISTORY      || []),
        ...(window.BOOKS_EARLY_CIV       || []),
        ...(window.BOOKS_CLASSICAL       || []),
        ...(window.BOOKS_POST_CLASSICAL  || []),
        ...(window.BOOKS_EARLY_MODERN    || []),
        ...(window.BOOKS_INDUSTRY_EMPIRE || []),
        ...(window.BOOKS_GLOBAL_CONFLICT || []),
        ...(window.BOOKS_CONTEMPORARY    || [])
      ];
      booksLoaded = true;
      resolve();
    }

    files.forEach(src => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = tryFinish;
      s.onerror = tryFinish;
      document.head.appendChild(s);
    });
  });
}

function searchBooks(title, author){
  const titleKw = (title || "").trim();
  const authorKw = (author || "").trim();
  if (!titleKw && !authorKw) return [];

  const exact = BOOKS.filter(b =>
    (titleKw && b.title === titleKw) ||
    (authorKw && b.author === authorKw)
  );
  const fuzzy = BOOKS.filter(b =>
    (titleKw && b.title && b.title.includes(titleKw) && b.title !== titleKw) ||
    (authorKw && b.author && b.author.includes(authorKw) && b.author !== authorKw)
  );

  const seen = new Set();
  const result = [];
  for (const b of [...exact, ...fuzzy]){
    const key = (b.title || "") + "||" + (b.author || "");
    if (seen.has(key)) continue;
    seen.add(key);
    result.push(b);
  }
  return result;
}

function setLoggedIn(value) {
  $("loginPanel").classList.toggle("hidden", value);
  $("dashboard").classList.toggle("hidden", !value);
}

async function apiRequest(path, options = {}) {
  const response = await fetch(API_BASE + path, {
    method: options.method || "GET",
    headers: {
      "Authorization": "Bearer " + adminSecret,
      ...(options.body !== undefined
        ? { "Content-Type": "application/json" }
        : {})
    },
    body: options.body !== undefined
      ? JSON.stringify(options.body)
      : undefined,
    cache: "no-store"
  });

  let data;

  try {
    data = await response.json();
  } catch {
    throw new Error("服务器返回了无法识别的数据。");
  }

  if (response.status === 401) {
    logout();
    throw new Error("管理员身份验证失败，请重新登录。");
  }

  if (!response.ok || data.ok !== true) {
    throw new Error(data.error || "请求失败，请稍后重试。");
  }

  return data;
}

function logout() {
  adminSecret = "";
  requestVersion++;

  $("secret").value = "";
  $("submissionList").replaceChildren();

  hideMessage($("listMessage"));
  hideMessage($("loginMessage"));

  setLoggedIn(false);
}

$("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const secret = $("secret").value.trim();
  console.log(
  "密钥长度：", secret.length,
  "是否只包含 ASCII 字符：", /^[\x00-\x7F]*$/.test(secret),
  "是否包含首尾空白：", secret !== secret.trim()
);
  const button = $("loginButton");

  if (secret.length < 32) {
    showMessage(
      $("loginMessage"),
      "密钥长度不足，请检查后重试。",
      "error"
    );
    return;
  }

  button.disabled = true;
  button.textContent = "正在验证……";
  hideMessage($("loginMessage"));

  // 临时使用输入的密钥验证身份。
  adminSecret = secret;

  try {
    // 只有成功读取管理员接口，才算登录成功。
    await apiRequest(
      "/admin/submissions?status=pending"
    );

    $("secret").value = "";
    setLoggedIn(true);

    await loadSubmissions();
  } catch (error) {
    adminSecret = "";

    showMessage(
      $("loginMessage"),
      error.message || "登录失败，请检查密钥。",
      "error"
    );
  } finally {
    button.disabled = false;
    button.textContent = "登录";
  }
});

async function loadSubmissions() {
  if (!adminSecret) return;

  const version = ++requestVersion;
  const list = $("submissionList");
  const message = $("listMessage");

  list.replaceChildren();
  showMessage(message, "正在加载投稿……");

  try {
    const data = await apiRequest(
      "/admin/submissions?status=" +
      encodeURIComponent(currentStatus)
    );

    // 忽略已经过期的请求结果。
    if (version !== requestVersion) return;

    const submissions = Array.isArray(data.submissions)
      ? data.submissions
      : [];

    if (submissions.length === 0) {
      hideMessage(message);
      list.innerHTML =
        '<div class="card muted">这个分类暂时没有投稿。</div>';
      return;
    }

    hideMessage(message);

    list.innerHTML = submissions.map((item) => {
      const id = Number(item.id);

      const link = safeExternalLink(item.reading_link);
      const source = safeExternalLink(item.source);

      return `
        <article class="submission">
          <h3>${escapeHTML(item.title || "未填写书名")}</h3>

          <div class="details">
            <div class="detail">
              <strong>投稿编号</strong>
              ${escapeHTML(item.id)}
            </div>

            <div class="detail">
              <strong>原文书名</strong>
              ${escapeHTML(item.original_title || "未填写")}
            </div>

            <div class="detail">
              <strong>作者</strong>
              ${escapeHTML(item.author || "未填写")}
            </div>

            <div class="detail">
              <strong>时代</strong>
              ${escapeHTML(item.era || "未填写")}
            </div>

            <div class="detail">
              <strong>国家 / 地区</strong>
              ${escapeHTML(item.country || "未填写")}
            </div>

            <div class="detail">
              <strong>作者性别分类</strong>
              ${escapeHTML(item.gender || "未填写")}
            </div>

            <div class="detail">
              <strong>体裁</strong>
              ${escapeHTML(item.genre || "未填写")}
            </div>

            <div class="detail">
              <strong>当前状态</strong>
              ${escapeHTML(item.status || "未知")}
            </div>

            <div class="detail full">
              <strong>阅读链接</strong>
              ${link}
            </div>

            <div class="detail full">
              <strong>投稿理由</strong>
              <div>${escapeHTML(item.reason || "未填写")}</div>
            </div>

            <div class="detail full">
              <strong>来源链接</strong>
              ${source}
            </div>

            <div class="detail full">
              <strong>投稿时间</strong>
              ${escapeHTML(item.created_at || "未知")}
            </div>
          </div>

          <div class="actions" style="margin-bottom:10px;">
            <button
              class="small secondary"
              data-action="check"
              data-title="${escapeHTML(item.title || "")}"
              data-author="${escapeHTML(item.author || "")}"
            >🔍 在书库中查重</button>
          </div>

          <div class="checkResult" style="margin-bottom:10px;"></div>

          ${
            currentStatus === "pending"
              ? `
                <div class="actions">
                  <button
                    class="small"
                    data-action="approve"
                    data-id="${Number.isSafeInteger(id) && id > 0 ? id : 0}"
                  >✓ 通过投稿</button>

                  <button
                    class="small danger"
                    data-action="reject"
                    data-id="${Number.isSafeInteger(id) && id > 0 ? id : 0}"
                  >✕ 拒绝投稿</button>
                </div>
              `
              : currentStatus === "approved"
              ? `
                <div class="actions">
                  <button
                    class="small danger"
                    data-action="reject"
                    data-id="${Number.isSafeInteger(id) && id > 0 ? id : 0}"
                  >↩ 撤销通过（从书库下架）</button>
                </div>
              `
              : ""
          }
        </article>
      `;
    }).join("");

  } catch (error) {
    if (version !== requestVersion) return;

    showMessage(
      message,
      error.message || "加载失败，请重试。",
      "error"
    );
  }
}

function safeExternalLink(value) {
  if (typeof value !== "string" || !value.trim()) {
    return "未提供";
  }

  try {
    const url = new URL(value);

    if (url.protocol !== "https:" && url.protocol !== "http:") {
      return "链接格式不受支持";
    }

    return `<a href="${escapeHTML(url.href)}"
      target="_blank" rel="noopener noreferrer">打开链接 ↗</a>`;
  } catch {
    return "链接格式无效";
  }
}

$("submissionList").addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-action]");
  if (!button || !adminSecret) return;

  const action = button.dataset.action;

  // 查重：不需要管理员权限，只在本地书库搜索
  if (action === "check"){
    const title = button.dataset.title || "";
    const author = button.dataset.author || "";
    const resultEl = button.closest("article").querySelector(".checkResult");
    if (!resultEl) return;

    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = "🔍 加载书库中……";
    resultEl.innerHTML = '<span style="color:#77756d;">第一次使用需加载书库（约几秒）……</span>';

    try {
      await loadBooks();
      button.textContent = "🔍 查重中……";
      const hits = searchBooks(title, author);

      if (hits.length === 0){
        resultEl.innerHTML = '<span style="color:#285b37;">✅ 书库里没有找到同名或相似的书</span>';
      } else {
        let html = '<div style="color:#a35a00;margin-bottom:6px;">⚠️ 书库里已有相似的记录（' + hits.length + ' 条）：</div>';
        hits.slice(0, 8).forEach(b => {
          html += '<div style="padding:6px 10px;background:#f7f5ef;border-radius:6px;margin-bottom:4px;">';
          html += '<strong>《' + escapeHTML(b.title) + '》</strong>';
          if (b.author) html += ' — ' + escapeHTML(b.author);
          html += ' <span style="color:#77756d;">（' + escapeHTML(b.era) + ' · ' + escapeHTML(b.country) + '）</span>';
          html += '</div>';
        });
        if (hits.length > 8){
          html += '<div style="color:#77756d;">……还有 ' + (hits.length - 8) + ' 条</div>';
        }
        resultEl.innerHTML = html;
      }
    } catch (err){
      resultEl.innerHTML = '<span style="color:#8b2929;">书库加载失败：' + escapeHTML(err.message || err) + '</span>';
    } finally {
      button.disabled = false;
      button.textContent = originalText;
    }
    return;
  }

  const id = Number(button.dataset.id);

  if (
    !Number.isSafeInteger(id) ||
    id <= 0 ||
    !["approve", "reject"].includes(action)
  ) {
    return;
  }

  const isApprove = action === "approve";
  const operation = isApprove
    ? "通过"
    : (currentStatus === "approved" ? "撤销通过（从书库下架）" : "拒绝");

  if (!confirm(`确定要${operation}这条投稿吗？`)) {
    return;
  }

  button.disabled = true;
  button.textContent = "处理中……";

  try {
    await apiRequest("/admin/" + action, {
      method: "POST",
      body: { id }
    });

    showMessage(
      $("listMessage"),
      `投稿 #${id} 已${operation}。`,
      "success"
    );

    await loadSubmissions();
  } catch (error) {
    showMessage(
      $("listMessage"),
      error.message || "操作失败，请重试。",
      "error"
    );

    button.disabled = false;
    button.textContent = isApprove
      ? "✓ 通过投稿"
      : "✕ 拒绝投稿";
  }
});

document.querySelectorAll(".tab").forEach((button) => {
  button.addEventListener("click", async () => {
    currentStatus = button.dataset.status;

    document.querySelectorAll(".tab").forEach((tab) => {
      const active = tab === button;

      tab.classList.toggle("active", active);
      tab.classList.toggle("secondary", !active);
    });

    await loadSubmissions();
  });
});
// ===== 管理员独立查重窗口 =====
async function runAdminSearch(){
  const input = $("adminSearchInput");
  const resultEl = $("adminSearchResult");
  const button = $("adminSearchButton");
  if (!input || !resultEl || !button) return;

  const kw = input.value.trim();
  if (!kw){
    resultEl.innerHTML = '<span style="color:#77756d;">请输入关键词。</span>';
    return;
  }

  const originalText = button.textContent;
  button.disabled = true;
  button.textContent = "搜索中……";

  try {
    if (!booksLoaded){
      resultEl.innerHTML = '<span style="color:#77756d;">首次搜索需加载书库（约几秒）……</span>';
      await loadBooks();
    }

    const exact = BOOKS.filter(b => b.title === kw || b.author === kw);
    const fuzzy = BOOKS.filter(b =>
      ((b.title && b.title.includes(kw)) || (b.author && b.author.includes(kw))) &&
      !(b.title === kw || b.author === kw)
    );
    const matched = [...exact, ...fuzzy];

    if (matched.length === 0){
      resultEl.innerHTML = '<span style="color:#285b37;">✅ 书库里没有找到匹配的书</span>';
      return;
    }

    let html = '<div style="color:#a35a00;margin-bottom:8px;">找到 <strong>' + matched.length + '</strong> 条匹配：</div>';
    matched.slice(0, 30).forEach(b => {
      html += '<div style="padding:10px 14px;background:#f7f5ef;border-radius:8px;margin-bottom:6px;">';
      html += '<strong>《' + escapeHTML(b.title) + '》</strong>';
      if (b.author) html += ' — ' + escapeHTML(b.author);
      html += ' <span style="color:#77756d;">（' +
        escapeHTML(b.era || "") + ' · ' +
        escapeHTML(b.country || "") + ' · ' +
        escapeHTML(b.gender || "") + ' · ' +
        escapeHTML(b.genre || "") +
      '）</span>';
      html += '</div>';
    });
    if (matched.length > 30){
      html += '<div style="color:#77756d;">……还有 ' + (matched.length - 30) + ' 条未显示</div>';
    }
    resultEl.innerHTML = html;

  } catch (err){
    resultEl.innerHTML = '<span style="color:#8b2929;">搜索失败：' + escapeHTML(err.message || err) + '</span>';
  } finally {
    button.disabled = false;
    button.textContent = originalText;
  }
}

$("adminSearchButton").addEventListener("click", runAdminSearch);
$("adminSearchInput").addEventListener("keypress", function(e){
  if (e.key === "Enter") runAdminSearch();
});

$("refreshButton").addEventListener("click", loadSubmissions);
$("logoutButton").addEventListener("click", logout);

// 切换页面标签或离开页面时清除内存中的密钥。
window.addEventListener("pagehide", logout);
</script>
</body>
</html>
